#Datasource
spring.datasource.url=jdbc:mysql://localhost:3306/ong?allowPublicKeyRetrieval=true&useSSL=false&useTimezone=true&serverTimezone=GMT&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

#Hibernate
spring.jpa.hibernate.ddl-auto=update
server.error.include-stacktrace=never
server.error.include-binding-errors=always
server.error.include-message=always
server.error.include-exception=false


#SQL configuration
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

#Swagger
project.version =
springdoc.api-docs.path=/api/docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.path=/swagger-ui-custom.html
springdoc.paths-to-exclude=/swagger-resources/**, /users/accessdenied
springdoc.swagger-ui.default-models-expand-depth=-1
springdoc.swagger-ui.tags-sorter=alpha

#SendGrid
alkemy.ong.email.api_key=${SENDGRID_API_KEY:}
alkemy.ong.email.sender=${EMAIL_SENDER:}
alkemy.ong.email.enabled=${EMAIL_ENABLED:false}

#Amazon S3
amazonProperties.endpointUrl= https://s3.us-east-2.amazonaws.com/
amazonProperties.accessKey=${AWS_ACCESS_KEY_ID:}
amazonProperties.secretKey=${AWS_SECRET_ACCESS_KEY:}
amazonProperties.bucketName= Insert your Amazon credentials here
amazonProperties.region= us-east-1

# Required Base64 signing key; no default is accepted.
security.jwt.secret=${JWT_SECRET}
